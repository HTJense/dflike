top_hat_band:

beam_profile: 
#  beam_from_file: null

normalisation:
  nu_0: 150.0
  ell_0: 3000
  T_CMB: 2.725

experiments:
  - dr6_pa4_f220
  - dr6_pa5_f090
  - dr6_pa5_f150
  - dr6_pa6_f090
  - dr6_pa6_f150

bandint_freqs: [220, 90, 150, 90, 150]

components:
  tt:
    kSZ:
      CrossProductModel:
        - TemplateCl:
            filename: cl_ksz_bat.dat
        - ConstantSED:
      params:
        - a_kSZ
    tSZ_and_CIB:
      CorrelatedCrossProductModel:
        - RescaledTemplateCl:
            filename: cl_tsz_150_bat.dat
        - RescaledTemplateCl:
            filename: cl_cib_Choi2020.dat
            alpha_0: 0.8
        - TemplateCl:
            filename: cl_sz_x_cib.dat
        - ThermalSZSED:
        - ModifiedBlackBodySED:
      params:
        - a_tSZ
        - alpha_tSZ
        - a_c
        - alpha_c
        - xi
        - beta_c
        - T_d
    cibp:
      CrossProductModel:
        - PoissonCl:
        - ModifiedBlackBodySED:
      params:
        - a_p
        - alpha_p
        - beta_p
        - T_d
    radio:
      CrossProductModel:
        - PoissonCl:
        - PowerLawSED:
      params:
        - a_s
        - alpha_s
        - beta_s
    dust:
      CrossProductModel:
        - PowerLawCl:
            ell_0: 500
        - ModifiedBlackBodySED:
      params:
        - a_gtt
        - alpha_dT
        - beta_d
        - T_effd
  te:
    radio:
      CrossProductModel:
        - PoissonCl:
        - PowerLawSED:
      params:
        - a_pste
        - alpha_s
        - beta_s
    dust:
      CrossProductModel:
        - PowerLawCl:
            ell_0: 500
        - ModifiedBlackBodySED:
      params:
        - a_gte
        - alpha_dE
        - beta_d
        - T_effd
  ee:
    radio:
      CrossProductModel:
        - PoissonCl:
        - PowerLawSED:
      params:
        - a_psee
        - alpha_s
        - beta_s
    dust:
      CrossProductModel:
        - PowerLawCl:
            ell_0: 500
        - ModifiedBlackBodySED:
      params:
        - a_gee
        - alpha_dE
        - beta_d
        - T_effd
