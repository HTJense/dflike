# A cobaya likelihood for ACT DR6 data
# see https://github.com/simonsobs/LAT_MFLike/blob/master/mflike/MFLike.yaml
# for more details regarding section

data_folder: ACTDR6MFLike/v1.0

input_file: dr6_data.fits

requested_cls: ["tt", "te", "ee"]

# Specify default set of spectra and scale cuts
# to be used
defaults:
  symmetrize: false
  polarizations: [TT, TE, ET, EE]
  polarizations_auto: &polarizations_auto [TT, TE, EE]
  lmax: &lmax 8500
  scales:
    TT: [2, *lmax]
    TE: [2, *lmax]
    ET: [2, *lmax]
    EE: [2, *lmax]

data:
  experiments:
    - dr6_pa4_f220
    - dr6_pa5_f090
    - dr6_pa5_f150
    - dr6_pa6_f090
    - dr6_pa6_f150

  spectra:
    - experiments: [dr6_pa4_f220, dr6_pa4_f220]
      polarizations: &pol_pa4_f220 [TT]
      scales: &scales_pa4
        TT: [1000, *lmax]
    - experiments: [dr6_pa4_f220, dr6_pa5_f090]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa5_f150]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa6_f090]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa6_f150]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4

    - experiments: [dr6_pa5_f090, dr6_pa5_f090]
      polarizations: *polarizations_auto
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa5_f150]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa6_f090]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa6_f150]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]

    - experiments: [dr6_pa5_f150, dr6_pa5_f150]
      polarizations: *polarizations_auto
      scales:
        TT: [800, *lmax]
        TE: [800, *lmax]
        EE: [800, *lmax]
    - experiments: [dr6_pa5_f150, dr6_pa6_f090]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f150, dr6_pa6_f150]
      scales:
        TT: [800, *lmax]
        TE: [800, *lmax]
        ET: [800, *lmax]
        EE: [800, *lmax]

    - experiments: [dr6_pa6_f090, dr6_pa6_f090]
      polarizations: *polarizations_auto
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa6_f090, dr6_pa6_f150]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]

    - experiments: [dr6_pa6_f150, dr6_pa6_f150]
      polarizations: *polarizations_auto
      scales:
        TT: [600, *lmax]
        TE: [600, *lmax]
        EE: [600, *lmax]


params:
  bandint_shift_dr6_pa4_f220:
    prior:
      dist: norm
      loc: 0.0
      scale: 3.6
    ref:
      dist: norm
      loc: 0.0
      scale: 3.6
    proposal: 1.8
    latex: \Delta_{\rm band, pa4}^{\rm f220}
  bandint_shift_dr6_pa5_f090:
    prior:
      dist: norm
      loc: 0.0
      scale: 1.0
    ref:
      dist: norm
      loc: 0.0
      scale: 1.0
    proposal: 0.5
    latex: \Delta_{\rm band, pa5}^{\rm f090}
  bandint_shift_dr6_pa5_f150:
    prior:
      dist: norm
      loc: 0.0
      scale: 1.3
    ref:
      dist: norm
      loc: 0.0
      scale: 1.3
    proposal: 0.65
    latex: \Delta_{\rm band, pa5}^{\rm f150}
  bandint_shift_dr6_pa6_f090:
    prior:
      dist: norm
      loc: 0.0
      scale: 1.2
    ref:
      dist: norm
      loc: 0.0
      scale: 1.2
    proposal: 0.6
    latex: \Delta_{\rm band, pa6}^{\rm f090}
  bandint_shift_dr6_pa6_f150:
    prior:
      dist: norm
      loc: 0.0
      scale: 1.1
    ref:
      dist: norm
      loc: 0.0
      scale: 1.1
    proposal: 0.55
    latex: \Delta_{\rm band, pa6}^{\rm f150}
  
  calG_all:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.003
    ref:
      dist: norm
      loc: 1.0
      scale: 0.003
    proposal: 0.0015
    latex: \mathrm{cal}_{\rm ACT}
  
  calE_dr6_pa4_f220:
    # We do not use the polarization channel of PA4, so we don't vary this parameter.
    value: 1.0
    latex: \mathrm{p}_{\rm pa4}^{\rm f220}
  calE_dr6_pa5_f090:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 1.0
      scale: 0.02
    proposal: 0.01
    latex: \mathrm{p}_{\rm pa5}^{\rm f090}
  calE_dr6_pa5_f150:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 1.0
      scale: 0.02
    proposal: 0.01
    latex: \mathrm{p}_{\rm pa5}^{\rm f150}
  calE_dr6_pa6_f090:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 1.0
      scale: 0.02
    proposal: 0.01
    latex: \mathrm{p}_{\rm pa6}^{\rm f090}
  calE_dr6_pa6_f150:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 1.0
      scale: 0.02
    proposal: 0.01
    latex: \mathrm{p}_{\rm pa6}^{\rm f150}
  
  cal_dr6_pa4_f220:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.013
    ref:
      dist: norm
      loc: 1.0
      scale: 0.01
    proposal: 1e-2
    latex: \mathrm{c}_{\rm pa4}^{\rm f220}
  cal_dr6_pa5_f090:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.0016
    ref:
      dist: norm
      loc: 1.0
      scale: 0.01
    proposal: 1e-3
    latex: \mathrm{c}_{\rm pa5}^{\rm f090}
  cal_dr6_pa5_f150:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.0020
    ref:
      dist: norm
      loc: 1.0
      scale: 0.01
    proposal: 1e-3
    latex: \mathrm{c}_{\rm pa5}^{\rm f150}
  cal_dr6_pa6_f090:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.0018
    ref:
      dist: norm
      loc: 1.0
      scale: 0.01
    proposal: 1e-3
    latex: \mathrm{c}_{\rm pa6}^{\rm f090}
  cal_dr6_pa6_f150:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.0024
    ref:
      dist: norm
      loc: 1.0
      scale: 0.01
    proposal: 1e-3
    latex: \mathrm{c}_{\rm pa6}^{\rm f150}
